<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The title and icon placeholders are filled from the lesson's lesson.json (build_scripts/build.mjs) -->
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>__ICON__</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- The lesson's colours and decorations (theme.css in the lesson folder), on top of the engine style -->
<link rel="stylesheet" href="theme.css">
</head>
<!-- data-mode is filled from game.json: "assemble" (tiles) or "aloud" (reading aloud); each mode hides the other's blocks -->
<body data-mode="__MODE__">
<header>
  <nav id="levels" class="levels" aria-label="Уровни"></nav>
  <div id="score" class="score only-aloud" title="Очки: сколько слов прочитано без подсказки" aria-live="polite"></div>
</header>

<main>
  <section class="board">
    <img id="picture" class="picture" alt="" hidden>
    <div class="word-row">
      <div id="word" class="word" aria-label="Слово"></div>
      <button id="say-word" class="speaker big only-assemble" title="Послушать слово по слогам" aria-label="Послушать слово"></button>
    </div>
    <p id="heard" class="heard only-aloud" aria-live="polite"></p>
  </section>

  <button id="speak" class="mic only-aloud" title="Прочитать слово вслух (Enter)">
    <span aria-hidden="true">🎤</span><span id="speak-label">Читать</span>
  </button>

  <p id="message" role="status"></p>

  <section class="controls">
    <button id="erase" class="btn only-assemble" title="Стереть последний слог (Backspace)">⌫ Стереть</button>
    <button id="check" class="btn primary only-assemble" title="Проверить (Enter)">Проверить</button>
    <button id="manual-ok" class="btn only-aloud" hidden>👍 Получилось</button>
    <button id="next" class="btn">Другое слово</button>
  </section>

  <section id="tiles" class="tiles only-assemble" aria-label="Слоги и буквы"></section>
  <p id="note" class="note only-aloud" hidden></p>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div id="overlay-icon" class="card-icon"></div>
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <button id="overlay-btn" class="btn primary"></button>
  </div>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>
<div class="grass" aria-hidden="true"></div>

<!-- Classic scripts, not modules: this way the game also opens by double-click, without a server -->
<script src="data.js"></script>
<script src="common.js"></script>
<script src="__MODE__.js"></script>
</body>
</html>
