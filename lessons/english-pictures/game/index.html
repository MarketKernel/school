<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Найди картинку</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav id="topics" class="topics" aria-label="Темы"></nav>
  <div id="score" class="score" title="Очки: сколько картинок найдено с первой попытки" aria-live="polite"></div>
</header>

<main>
  <button id="listen" class="listen" title="Послушать слово ещё раз (пробел)">
    <span class="listen-icon" aria-hidden="true">🔊</span><span>Послушай</span>
  </button>

  <p id="message" role="status"></p>

  <section id="cards" class="cards" aria-label="Картинки"></section>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div id="overlay-icon" class="card-icon"></div>
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <button id="overlay-btn" class="btn"></button>
  </div>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>

<!-- Classic scripts, not modules: this way the game also opens by double-click, without a server -->
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
