<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- The page lives in tools/, while the sounds and lists are in lessons/russian: all paths are relative to it -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись звуков</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  select, button { font: inherit; font-size: 18px; padding: 8px 14px; border-radius: 10px; border: 2px solid #ccc; background: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .item { font-size: 140px; font-weight: 800; text-align: center; line-height: 1.1; margin: 16px 0; }
  .rec { display: block; margin: 0 auto; font-size: 26px; padding: 18px 36px; border-color: #ef4444; color: #ef4444; }
  .rec.on { background: #ef4444; color: #fff; }
  #status { text-align: center; min-height: 1.5em; margin: 12px 0; color: #555; }
  #status.err { color: #dc2626; }
  .take { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 10px 14px; margin: 10px 0;
          display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .take b { margin-right: 6px; }
  .take .use { border-color: #16a34a; color: #16a34a; }
  .take.used { border-color: #16a34a; background: #f0fdf4; }
  .hint { color: #777; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <select id="item"></select>
    <button id="play-current" title="Как звучит сейчас в игре">▶ сейчас в игре</button>
    <label><input type="checkbox" id="to-voice" checked> перевести в голос из speak.py (Olga)</label>
  </div>

  <div class="item" id="big"></div>
  <button class="rec" id="rec">● Запись</button>
  <p id="status"></p>
  <p class="hint">Пробел — начать/остановить запись. Говорите близко к микрофону, в тихой комнате.
    Скажите звук один раз — тишину по краям сервер обрежет сам.</p>

  <div id="takes"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let files = {};          // letter/syllable -> file in audio/
let recorder = null;
let chunks = [];
let takeNo = 0;
let player;

function play(url) {
  player?.pause();
  player = new Audio(url + "?t=" + Date.now());  // bypass the cache: the file may have just changed
  player.play();
}

function status(text, isError = false) {
  $("status").textContent = text;
  $("status").className = isError ? "err" : "";
}

// ---------- Letters and syllables list ----------

async function loadItems() {
  const [letters, soft, syllables] = await Promise.all(
    ["letters", "soft", "syllables"].map(k => fetch(`audio/${k}.json`).then(r => (r.ok ? r.json() : {}))));
  files = { ...letters, ...soft, ...syllables };
  const select = $("item");
  for (const [label, group] of [["Буквы", letters], ["Мягкие", soft], ["Слоги", syllables]]) {
    const og = document.createElement("optgroup");
    og.label = label;
    for (const item of Object.keys(group)) og.append(new Option(item, item));
    select.append(og);
  }
  select.value = new URLSearchParams(location.search).get("item") || "л";
  select.onchange = () => { $("big").textContent = select.value; $("takes").replaceChildren(); takeNo = 0; };
  select.onchange();
}

// ---------- Recording ----------

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      // No browser "enhancements": they eat sibilants and change the volume
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); send(new Blob(chunks)); };
    recorder.start();
    $("rec").classList.add("on");
    $("rec").textContent = "■ Стоп";
    status("Говорите…");
  } catch (e) {
    status("Нет доступа к микрофону: " + e.message, true);
  }
}

function stop() {
  recorder?.stop();
  recorder = null;
  $("rec").classList.remove("on");
  $("rec").textContent = "● Запись";
}

/** The browser records webm/mp4 — convert to WAV (mono, 16-bit), which both lame and ElevenLabs accept. */
async function toWav(blob) {
  const ctx = new AudioContext();
  const audio = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close();
  const data = audio.getChannelData(0);
  const buffer = new ArrayBuffer(44 + data.length * 2);
  const v = new DataView(buffer);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + data.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, audio.sampleRate, true); v.setUint32(28, audio.sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, data.length * 2, true);
  data.forEach((x, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x)) * 0x7fff, true));
  return new Blob([buffer], { type: "audio/wav" });
}

async function send(blob) {
  const item = $("item").value;
  const toVoice = $("to-voice").checked;
  status(toVoice ? "Обрабатываю и перевожу в голос Olga…" : "Обрабатываю…");
  $("rec").disabled = true;
  try {
    const wav = await toWav(blob);
    const res = await fetch(`/api/record?item=${encodeURIComponent(item)}&voice=${toVoice ? 1 : 0}`, { method: "POST", body: wav });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    addTake(item, data);
    status("Готово — послушайте и поставьте лучший дубль");
    play(data.voice || data.own);
  } catch (e) {
    status("Ошибка: " + e.message, true);
  } finally {
    $("rec").disabled = false;
  }
}

// ---------- Takes ----------

function addTake(item, data) {
  const box = document.createElement("div");
  box.className = "take";
  box.innerHTML = `<b>Дубль ${++takeNo}</b>`;
  const variants = [["свой", data.own], ["Olga", data.voice]].filter(([, f]) => f);
  for (const [label, file] of variants) {
    const p = document.createElement("button");
    p.textContent = `▶ ${label}`;
    p.onclick = () => play(file);
    const u = document.createElement("button");
    u.className = "use";
    u.textContent = `Поставить ${label}`;
    u.onclick = () => use(item, file, box);
    box.append(p, u);
  }
  $("takes").prepend(box);
}

async function use(item, file, box) {
  status("Ставлю в игру…");
  try {
    const res = await fetch("/api/use", { method: "POST", body: JSON.stringify({ item, file }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    document.querySelectorAll(".take.used").forEach(b => b.classList.remove("used"));
    box.classList.add("used");
    status(`Поставлено: ${data.updated.join(", ")}. ` + (data.built ? "Игра пересобрана." : "Сборка не удалась: " + data.buildLog));
  } catch (e) {
    status("Ошибка: " + e.message, true);
  }
}

$("rec").onclick = () => (recorder ? stop() : start());
$("play-current").onclick = () => play(`audio/${files[$("item").value]}`);
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "SELECT") { e.preventDefault(); $("rec").click(); }
});
loadItems();
</script>
</body>
</html>
