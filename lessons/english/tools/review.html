<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- The page lives in tools/, while sounds, pictures and lists are one level up: all paths are relative to lessons/english -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка слов</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px 16px 200px; background: #fafafa; color: #222; }
  h2 { margin: 24px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #fff; border: 3px solid #e5e5e5; border-radius: 14px; padding: 8px; text-align: center; }
  figure.bad { border-color: #ef4444; background: #fee2e2; }
  img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; border-radius: 8px; cursor: pointer; }
  .missing { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
             background: #f3f3f3; border-radius: 8px; color: #999; }
  figcaption b { display: block; font-size: 22px; margin-top: 6px; }
  figcaption small { color: #777; font-size: 12px; line-height: 1.3; display: block; }
  .row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .row button { font-size: 15px; padding: 4px 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .row button.on { background: #ef4444; border-color: #ef4444; color: #fff; }
  .row button:disabled { opacity: 0.4; cursor: default; }
  .hint { color: #666; max-width: 760px; }
  #redo { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 12px 16px; background: #fff;
          border-top: 1px solid #ddd; white-space: pre-wrap; font-size: 14px; }
</style>
</head>
<body>
<p class="hint">Клик по картинке или «▶» — послушать слово. «🖼 ✗» и «🔊 ✗» — пометить неудачную картинку или звук:
  внизу появится команда, чтобы переделать помеченные. Описание картинки можно поправить в data/words.tsv перед перерисовкой.
  Пометки сохраняются в браузере.</p>
<p id="summary" class="hint"></p>
<div id="topics"></div>
<pre id="redo"></pre>

<script>
// Same as slug() in tools/common.py and ../words.mjs
const slug = (word) => word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const KEY = "english-words-review";
let marks;
try { marks = JSON.parse(localStorage.getItem(KEY)) || { image: [], audio: [] }; } catch { marks = { image: [], audio: [] }; }
const bad = { image: new Set(marks.image), audio: new Set(marks.audio) };
let player = null;

function play(word) {
  player?.pause();
  player = new Audio(`audio/${slug(word)}.mp3?t=${Date.now()}`);
  player.play().catch(() => {});
}

// Words with spaces («ice cream») need quotes in the shell
const arg = (words) => { const s = [...words].join(","); return s.includes(" ") ? `"${s}"` : s; };

function update() {
  try { localStorage.setItem(KEY, JSON.stringify({ image: [...bad.image], audio: [...bad.audio] })); } catch {}
  const lines = [];
  if (bad.image.size) lines.push(`python3 tools/draw.py --redo ${arg(bad.image)}`);
  if (bad.audio.size) lines.push(`python3 tools/speak.py --redo ${arg(bad.audio)}`);
  document.getElementById("redo").textContent = lines.join("\n") || "— пока ничего не помечено —";
}

function exists(url) {
  return fetch(url, { method: "HEAD" }).then((r) => r.ok, () => false);
}

(async () => {
  const read = (name) => fetch(`data/${name}`).then((r) => r.text())
    .then((t) => t.trim().split("\n").slice(1).map((l) => l.split("\t")));
  const [topics, words] = await Promise.all([read("topics.tsv"), read("words.tsv")]);
  let images = 0, sounds = 0;
  for (const [key, icon, name] of topics) {
    const h = document.createElement("h2");
    h.textContent = `${icon} ${name}`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const [, word, ru, what] of words.filter((w) => w[0] === key)) {
      const s = slug(word);
      const [hasImage, hasAudio] = await Promise.all([exists(`images/${s}.jpg`), exists(`audio/${s}.mp3`)]);
      images += hasImage; sounds += hasAudio;
      const fig = document.createElement("figure");
      fig.innerHTML = (hasImage ? `<img src="images/${s}.jpg?t=${Date.now()}" alt="">` : `<div class="missing">нет картинки</div>`) +
        `<figcaption><b>${word}</b><small>${ru} · ${what}</small></figcaption>` +
        `<div class="row"><button data-play ${hasAudio ? "" : "disabled"}>▶</button>` +
        `<button data-kind="image">🖼 ✗</button><button data-kind="audio">🔊 ✗</button></div>`;
      fig.querySelector("img")?.addEventListener("click", () => hasAudio && play(word));
      fig.querySelector("[data-play]").onclick = () => play(word);
      for (const btn of fig.querySelectorAll("[data-kind]")) {
        const kind = btn.dataset.kind;
        const paint = () => {
          btn.classList.toggle("on", bad[kind].has(word));
          fig.classList.toggle("bad", bad.image.has(word) || bad.audio.has(word));
        };
        btn.onclick = () => { bad[kind].has(word) ? bad[kind].delete(word) : bad[kind].add(word); paint(); update(); };
        paint();
      }
      grid.append(fig);
    }
    document.getElementById("topics").append(h, grid);
  }
  document.getElementById("summary").textContent = `Слов: ${words.length}, картинок: ${images}, звуков: ${sounds}.`;
  update();
})().catch((e) => {
  document.body.prepend(`Не удалось прочитать data/*.tsv (${e.message}). Откройте страницу через сервер из папки lessons/english: ` +
    "python3 -m http.server 8000 → http://localhost:8000/tools/review.html");
});
</script>
</body>
</html>
