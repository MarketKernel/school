<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- The page lives in tools/, while sounds, pictures and lists are in the lesson folder: all paths are relative to it -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка звуков</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fafafa; color: #222; }
  h2 { margin: 24px 0 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  button.item { font-size: 28px; min-width: 72px; padding: 10px 14px; border: 2px solid #ccc;
                border-radius: 12px; background: #fff; cursor: pointer; }
  button.item.playing { border-color: #3b82f6; }
  button.item.bad { background: #fee2e2; border-color: #ef4444; }
  .hint { color: #666; }
  pre { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<p class="hint">Клик — послушать. Shift+клик (или долгое нажатие) — пометить как плохой.
Внизу появится команда, чтобы переозвучить помеченные.</p>

<h2>Буквы</h2>
<div class="grid" id="letters"></div>
<h2>Мягкие согласные</h2>
<div class="grid" id="soft"></div>
<h2>Слоги</h2>
<div class="grid" id="syllables"></div>

<h2>Переозвучить помеченные</h2>
<pre id="redo">— пока ничего не помечено —</pre>

<script>
// The working sound set — the one the game uses
const base = "audio";

const bad = new Set();
let current;

function play(src, btn) {
  if (current) current.pause();
  document.querySelectorAll(".playing").forEach(b => b.classList.remove("playing"));
  current = new Audio(src);
  btn.classList.add("playing");
  current.onended = () => btn.classList.remove("playing");
  current.play();
}

function toggleBad(item, btn) {
  bad.has(item) ? bad.delete(item) : bad.add(item);
  btn.classList.toggle("bad");
  document.getElementById("redo").textContent = bad.size
    ? `python3 tools/speak.py --redo ${[...bad].join(",")}`
    : "— пока ничего не помечено —";
}

async function show(kind) {
  const response = await fetch(`${base}/${kind}.json`);
  if (!response.ok) return;  // this kind of sound isn't in the set yet
  const manifest = await response.json();
  const grid = document.getElementById(kind);
  for (const [item, file] of Object.entries(manifest)) {
    const btn = document.createElement("button");
    btn.className = "item";
    btn.textContent = item;
    let timer;
    btn.onpointerdown = () => { timer = setTimeout(() => { timer = null; toggleBad(item, btn); }, 600); };
    btn.onpointerup = e => {
      if (!timer) return;  // the long press already fired
      clearTimeout(timer);
      e.shiftKey ? toggleBad(item, btn) : play(`${base}/${file}`, btn);
    };
    grid.append(btn);
  }
}

show("letters");
show("soft");
show("syllables");
</script>
</body>
</html>
