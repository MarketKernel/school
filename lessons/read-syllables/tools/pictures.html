<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- The page lives in tools/, while sounds, pictures and lists are in the lesson folder: all paths are relative to it -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картинки к словам</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fafafa; color: #222; }
  h2 { margin: 24px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #fff; border: 3px solid #e5e5e5; border-radius: 14px; padding: 8px;
           text-align: center; cursor: pointer; }
  figure.bad { border-color: #ef4444; background: #fee2e2; }
  img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; border-radius: 8px; }
  figcaption b { display: block; font-size: 20px; margin-top: 6px; }
  figcaption small { color: #777; font-size: 12px; line-height: 1.3; display: block; }
  .hint { color: #666; }
  pre { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<p class="hint">Клик по картинке — пометить как неудачную (красная). Внизу появится команда, чтобы перерисовать помеченные.
  Описание «что нарисовать» можно поправить в data/pictures.tsv перед перерисовкой.</p>
<div id="levels"></div>
<h2>Перерисовать помеченные</h2>
<pre id="redo">— пока ничего не помечено —</pre>

<script>
const LEVELS = { 1: "🌾 Соломенный домик", 2: "🪵 Домик из веток", 3: "🧱 Каменный дом" };
const bad = new Set();

function toggle(word, fig) {
  bad.has(word) ? bad.delete(word) : bad.add(word);
  fig.classList.toggle("bad");
  document.getElementById("redo").textContent = bad.size
    ? `python3 tools/draw.py --redo ${[...bad].join(",")}` : "— пока ничего не помечено —";
}

(async () => {
  const [tsv, files] = await Promise.all([
    fetch("data/pictures.tsv").then(r => r.text()),
    fetch("images.json").then(r => r.json()),
  ]);
  const rows = tsv.trim().split("\n").slice(1).map(l => l.split("\t"));
  for (const [level, title] of Object.entries(LEVELS)) {
    const h = document.createElement("h2");
    h.textContent = title;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const [lvl, word, what] of rows.filter(r => r[0] === level)) {
      const fig = document.createElement("figure");
      fig.innerHTML = `<img src="${files[word]}?t=${Date.now()}" alt=""><figcaption><b>${word}</b><small>${what}</small></figcaption>`;
      fig.onclick = () => toggle(word, fig);
      grid.append(fig);
    }
    document.getElementById("levels").append(h, grid);
  }
})();
</script>
</body>
</html>
